name: ProjectAtlas v2 live validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Extract isolated ProjectAtlas v2 bundle
        run: |
          mkdir project-atlas
          base64 --decode project-atlas-v2-source.b64 > project-atlas-v2-source.tar.gz
          tar -xzf project-atlas-v2-source.tar.gz -C project-atlas
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: project-atlas/requirements-dev.txt
      - name: Install dependencies
        working-directory: project-atlas
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Deterministic verification
        working-directory: project-atlas
        run: make verify
      - name: Real external v2 validation
        working-directory: project-atlas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python validation/live_e2e_v2.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-atlas-v2-live-evidence
          path: |
            project-atlas/live-e2e-v2-results.json
            project-atlas/live-kivymd-v2.html
            project-atlas/live-webpage-v2.html
            project-atlas/live-pypi-v2.html
          if-no-files-found: warn
