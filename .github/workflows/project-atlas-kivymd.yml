name: ProjectAtlas KivyMD live run

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-project-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && pip install fastapi uvicorn httpx
      - name: Compile isolated ProjectAtlas executable
        run: python -m py_compile project-atlas-kivymd.py
      - name: Run KivyMD entirely through ProjectAtlas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python project-atlas-kivymd.py
      - name: Upload program-generated result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-atlas-kivymd-result
          path: |
            kivymd-program-result.json
            kivymd-program-view.html
          if-no-files-found: error
