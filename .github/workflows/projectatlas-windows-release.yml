name: ProjectAtlas Windows portable release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build-and-live-test:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ATLAS_DISABLE_SCHEDULER: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble and verify isolated ProjectAtlas source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force project-atlas | Out-Null
          $encoded = ((0..4 | ForEach-Object { Get-Content ("project-atlas-source.part{0:D2}" -f $_) -Raw }) -join "")
          [IO.File]::WriteAllBytes("project-atlas-source.tar.gz", [Convert]::FromBase64String($encoded))
          $actual = (Get-FileHash project-atlas-source.tar.gz -Algorithm SHA256).Hash.ToLower()
          $expected = "170e637be5e8e3736fc9fc4f2bccf7bf2588e17f957305544e898ed28865e564"
          if ($actual -ne $expected) { throw "Source archive SHA-256 mismatch: $actual" }
          tar -xzf project-atlas-source.tar.gz -C project-atlas

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: project-atlas/requirements-dev.txt

      - name: Install build dependencies
        working-directory: project-atlas
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Deterministic verification
        working-directory: project-atlas
        run: |
          python -m compileall -q atlas tests validation
          pytest -q
          ruff check atlas tests validation --select E9,F63,F7,F82

      - name: Build portable Windows executables
        working-directory: project-atlas
        shell: pwsh
        run: |
          $common = @(
            "--noconfirm", "--clean", "--onefile",
            "--add-data", "atlas/static;atlas/static",
            "--hidden-import", "atlas.main",
            "--hidden-import", "uvicorn.logging",
            "--hidden-import", "uvicorn.loops.auto",
            "--hidden-import", "uvicorn.protocols.http.auto",
            "--hidden-import", "uvicorn.protocols.websockets.auto",
            "--hidden-import", "uvicorn.lifespan.on",
            "--collect-all", "uvicorn",
            "--collect-all", "sqlalchemy",
            "--collect-all", "pydantic"
          )
          python -m PyInstaller @common --name ProjectAtlasCLI atlas/cli.py
          python -m PyInstaller @common --windowed --name ProjectAtlas atlas/gui_entry.py
          if (!(Test-Path dist/ProjectAtlasCLI.exe)) { throw "ProjectAtlasCLI.exe was not built" }
          if (!(Test-Path dist/ProjectAtlas.exe)) { throw "ProjectAtlas.exe was not built" }

      - name: Run required URLs through built CLI
        working-directory: project-atlas
        shell: pwsh
        run: |
          $env:ATLAS_DATA_DIR = "$env:RUNNER_TEMP\projectatlas-live-data"
          New-Item -ItemType Directory -Force $env:ATLAS_DATA_DIR | Out-Null
          & .\dist\ProjectAtlasCLI.exe doctor | Tee-Object -FilePath BUILT_EXE_DOCTOR.json
          if ($LASTEXITCODE -ne 0) { throw "Built CLI doctor failed with exit code $LASTEXITCODE" }
          & .\dist\ProjectAtlasCLI.exe import validation\required_urls.txt --wait --profile standard | Tee-Object -FilePath BUILT_EXE_IMPORT.json
          $importExit = $LASTEXITCODE
          if ($importExit -notin @(0,2)) { throw "Built CLI import failed with unexpected exit code $importExit" }
          python validation\validate_catalog.py
          & .\dist\ProjectAtlasCLI.exe search "network topology" --json | Tee-Object -FilePath SEARCH_NETWORK_TOPOLOGY.json
          & .\dist\ProjectAtlasCLI.exe search "type:package dos" --json | Tee-Object -FilePath SEARCH_DOS_PACKAGES.json
          & .\dist\ProjectAtlasCLI.exe search "privacy guides" --json | Tee-Object -FilePath SEARCH_PRIVACY.json
          & .\dist\ProjectAtlasCLI.exe search "aftonbladet" --json | Tee-Object -FilePath SEARCH_AFTONBLADET.json
          & .\dist\ProjectAtlasCLI.exe ai-export --format jsonl --output AI_EXPORT.jsonl

      - name: Start built API and verify GUI endpoints
        working-directory: project-atlas
        shell: pwsh
        run: |
          $env:ATLAS_DATA_DIR = "$env:RUNNER_TEMP\projectatlas-live-data"
          $process = Start-Process -FilePath ".\dist\ProjectAtlasCLI.exe" -ArgumentList @("start","--no-browser","--port","8891","--log-level","error") -PassThru
          try {
            $ready = $false
            foreach ($attempt in 1..120) {
              try {
                $health = Invoke-RestMethod http://127.0.0.1:8891/health/ready -TimeoutSec 2
                if ($health.status -eq "ready") { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 250 }
            }
            if (!$ready) { throw "Built API did not become ready" }
            Invoke-RestMethod http://127.0.0.1:8891/health/live | ConvertTo-Json -Depth 10 | Set-Content BUILT_API_HEALTH.json -Encoding utf8
            Invoke-RestMethod http://127.0.0.1:8891/v1/dashboard | ConvertTo-Json -Depth 20 | Set-Content BUILT_API_DASHBOARD.json -Encoding utf8
            $html = Invoke-WebRequest http://127.0.0.1:8891/ -UseBasicParsing
            if ($html.Content -notmatch "ProjectAtlas") { throw "GUI index was not served" }
            $js = Invoke-WebRequest http://127.0.0.1:8891/assets/app.js -UseBasicParsing
            if ($js.Content -notmatch "AI-optimerad export") { throw "GUI JavaScript was not served" }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Assemble portable release
        working-directory: project-atlas
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release\ProjectAtlas | Out-Null
          Copy-Item dist\ProjectAtlas.exe release\ProjectAtlas\
          Copy-Item dist\ProjectAtlasCLI.exe release\ProjectAtlas\
          Copy-Item README.md,LICENSE,THIRD_PARTY_NOTICES.md release\ProjectAtlas\
          Copy-Item REQUIRED_URL_VALIDATION.json,BUILT_EXE_DOCTOR.json,BUILT_EXE_IMPORT.json,BUILT_API_HEALTH.json,BUILT_API_DASHBOARD.json release\ProjectAtlas\
          Copy-Item SEARCH_NETWORK_TOPOLOGY.json,SEARCH_DOS_PACKAGES.json,SEARCH_PRIVACY.json,SEARCH_AFTONBLADET.json,AI_EXPORT.jsonl release\ProjectAtlas\
          Compress-Archive -Path release\ProjectAtlas -DestinationPath release\ProjectAtlas-Windows-Portable.zip -Force
          Get-FileHash release\ProjectAtlas-Windows-Portable.zip -Algorithm SHA256 | ForEach-Object { $_.Hash.ToLower() + "  ProjectAtlas-Windows-Portable.zip" } | Set-Content release\ProjectAtlas-Windows-Portable.sha256

      - name: Upload Windows release and evidence
        uses: actions/upload-artifact@v4
        with:
          name: ProjectAtlas-Windows-Portable
          path: |
            project-atlas/release/ProjectAtlas-Windows-Portable.zip
            project-atlas/release/ProjectAtlas-Windows-Portable.sha256
            project-atlas/REQUIRED_URL_VALIDATION.json
            project-atlas/BUILT_EXE_IMPORT.json
            project-atlas/BUILT_EXE_DOCTOR.json
            project-atlas/BUILT_API_HEALTH.json
            project-atlas/BUILT_API_DASHBOARD.json
            project-atlas/SEARCH_NETWORK_TOPOLOGY.json
            project-atlas/SEARCH_DOS_PACKAGES.json
            project-atlas/SEARCH_PRIVACY.json
            project-atlas/SEARCH_AFTONBLADET.json
          if-no-files-found: error
